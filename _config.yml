# Site settings. If you change this file while running `bundle exec jekyll serve`,
# restart the server to see the changes.

title: Joel Mansor
tagline: Electrical and electronic engineering student
description: >-
  Third-year Electrical and Electronic Engineering student at the University of Auckland.
  I design PCBs, embedded systems and power electronics.
lang: en-NZ
url: "https://jmansor.com"
baseurl: ""

author: Joel Mansor
email: jmmansor@gmail.com
github_username: Jel2217
linkedin_username: joel-mansor   # delete this line to hide the LinkedIn link

# Used by jekyll-seo-tag for search results and link previews
social:
  name: Joel Mansor
  links:
    - https://github.com/Jel2217
    - https://www.linkedin.com/in/joel-mansor/

# No theme: the files in _layouts/, _includes/ and assets/ are the whole design
theme: null

# Each file in _projects/ becomes a page at /projects/<file-name>/
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs
  - node_modules
  - vendor
