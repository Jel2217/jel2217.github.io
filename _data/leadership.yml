# Clubs, leadership and music.
- role: Co-founder and Co-president
  org: ECSA, the Electrical and Computer Engineering Students' Association
  when: 2025 – now
  summary: >-
    I co-founded ECSA to give Electrical and Electronic and Computer Systems engineering students more
    networking and social opportunities. I built and lead the exec team, and we run promotion, meetings, and
    industry and social events (including a speed interviews event and a design competition). We grew to
    over 200 active members in our first year.

- role: Band Director
  org: Engineering Revue
  when: 2024 – now
  summary: >-
    I lead the Revue’s 16-piece stage band of engineers: arranging the music, running rehearsals and
    working with the other departments. The band has grown in both players and repertoire since I started.

- role: Avionics Team Member
  org: Auckland Programme for Space Systems
  when: 2024 – 2025
  summary: Avionics work on the university’s CubeSat design-and-build programme.

- role: French horn
  org: NZSO National Youth Orchestra
  when: 2024, 2025
  summary: Selected to play French horn in the orchestra.
